name: GitHub-Profile-Summary-Cards

on:
  schedule: # execute once every 24 hours, at midnight UTC
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    name: generate

    steps:
      - uses: actions/checkout@v7
      - uses: vn7n24fzkq/github-profile-summary-cards@release
        env:
          GITHUB_TOKEN: ${{ secrets.PROFILE_SUMMARY_CARDS_SECRET }}
        with:
          USERNAME: ${{ github.repository_owner }}
          THEME: default
