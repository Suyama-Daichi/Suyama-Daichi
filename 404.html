<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<script>(function(){try{var t=localStorage.getItem('theme');if(t==='light'||t==='dark')document.documentElement.dataset.theme=t;}catch(e){}})();</script>
<title>404 — d0nchan</title>
<!-- shortcut: relative paths only resolve for missing URLs one level deep (/<repo>/foo); switch to /<repo>/ absolute paths if deeper 404s matter -->
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&amp;family=JetBrains+Mono:wght@400;500&amp;display=swap">
<style>
:root{color-scheme:light dark;--bg:#FFFFFF;--fg:#111111;--fg2:#3A3A3A;--muted:#6B6B6B;--muted-inv:#BDBDBD;--line:#E5E5E5;--sub:#F2F2F2;--hover:#555555}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#0E0E0E;--fg:#EDEDED;--fg2:#C2C2C2;--muted:#8F8F8F;--muted-inv:#555555;--line:#2A2A2A;--sub:#1C1C1C;--hover:#B5B5B5}}
:root[data-theme="dark"]{--bg:#0E0E0E;--fg:#EDEDED;--fg2:#C2C2C2;--muted:#8F8F8F;--muted-inv:#555555;--line:#2A2A2A;--sub:#1C1C1C;--hover:#B5B5B5}
body{margin:0;background:var(--bg)}
a{color:var(--fg);text-decoration:none}a:hover{color:var(--hover)}
</style>
</head>
<body>
<main style="font-family: Inter, 'Noto Sans JP', sans-serif; color: var(--fg); min-height: 100vh; display: flex; flex-direction: column; justify-content: center; gap: 32px; max-width: 1200px; margin: 0 auto; padding: 0 clamp(16px, 4vw, 48px); box-sizing: border-box">
<p style="margin: 0; font-family: 'JetBrains Mono', monospace; font-size: 13px; color: var(--muted); letter-spacing: 0.04em">404 Not Found</p>
<a href="index.html" style="display: inline-flex; align-items: center; align-self: flex-start; min-height: 48px; padding: 0 24px; background: var(--fg); color: var(--bg); font-size: 15px; font-weight: 500">トップへ戻る</a>
</main>
</body>
</html>
